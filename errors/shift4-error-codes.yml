generated: '2026-06-20'
method: searched
source: https://docs.shift4.com/guides/appendices/error-codes
notes: >-
  Shift4 error registry. The modern surface is a single error.code field
  (initially rolled out for European hosted-REST merchants); legacy responses
  carried error.primaryCode + error.secondaryCode which map into error.code.
  This is the non-payments-decline error catalog (transport/validation/host
  errors); card-issuer authorization outcomes are in
  errors/shift4-decline-codes.yml.
envelope:
  fields:
    - error.code          # modern single code
    - error.shortText
    - error.longText
    - error.severity       # Info | Error | Alert
    - error.primaryCode    # legacy
    - error.secondaryCode  # legacy
