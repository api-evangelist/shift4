name: Shift4
kind: company
description: >-
  Shift4 (NYSE: FOUR) is a US-based integrated payments and commerce technology
  company headquartered in Center Valley, Pennsylvania, and a Fortune 1000
  business serving restaurants, hospitality, retail, gaming, stadiums,
  e-commerce, and nonprofit verticals. It operates as an end-to-end
  acquirer-processor, owning the full stack from its own gateway and card
  acquiring through in-person SkyTab POS hardware, online checkout, and
  alternative payment methods, and has expanded internationally through
  acquisitions including Finaro (Credorax), Global Blue, and others. Its public
  developer surface is genuinely API-native: a Redocly-powered developer portal
  at docs.shift4.com publishes the Shift4 Payment API, a single downloadable
  OpenAPI 3.1 definition (v1.7.57, 70 paths) covering card transactions,
  tokenization, gift cards, devices/terminals, ACH, QR and PayPal alternative
  payments, 3D Secure, payment links, checkout sessions, OCT payouts, and
  reporting, authenticated with a header AccessToken (API key) plus HMAC-SHA256
  request signing and backed by webhook event notifications, a sandbox, SDKs,
  and a published Postman collection.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
