      - S
      - I
      description: "Code indicating the Shift4 host response.        \n\nValue  | Description                                                                           | Details\n-------|---------------------------------------------------------------------------------------|--------\nA      | Approved                                                                              | The transaction is approved.\nC      | Approved                                                                              | The transaction is approved without requiring additional authorization because it is less than or equal to a ceiling amount. (The ceiling amount is the original authorization amount multiplied by the tolerance per the merchant’s settings with Shift4.)\nD      | Declined                                                                              | The transaction is declined. <b>Note: Shift4 automatically declines AVS/CSC failures if the [POSHANDLEAVSFAIL Api Option](/guides/appendices/api-options#poshandleavsfail) was not sent in the request.</b>\ne      | [Error](/guides/appendices/error-codes)                                               | There is an error condition.\nf      | [AVS or CSC failure](/guides/response-handling/understanding-avs-and-csc-verification)| An AVS or CSC failure has occurred (credit card only). <b>Note: This value will only be returned if the [POSHANDLEAVSFAIL Api Option](/guides/appendices/api-options#poshandleavsfail) was sent in the request.</b>\nP      | [Partial approval](/guides/advanced-concepts/partial-approval)                        | A partial approval has occurred.  Check `amount.total` for the approved amount.\nR      | Voice referral                                                                        | The transaction requires a voice referral.\n[blank]| Status is unknown                                                                     | The approval status is unknown.\nX      | Expired card                                                                          | There is an error condition due to the card being expired.\nS      | SCA Online PIN required                                                               | The contactless EMV transaction requires strong customer authentication to continue. The terminal must gather the online PIN if supported by the device form factor and CVM list then resubmit the transaction request.\nI      | SCA Interface switch required                                                         | The contactless EMV transaction requires strong customer authentication to continue. The terminal must look at the form factor indicator to determine if the transaction should be declined, switched to EMV contact or tapped again using CDCVM.\nJ      | Soft decline after exemption request                                                  | Transaction was soft declined. Returned when requesting an exemption by sending `transaction.exemptionAction = 02` and the card issuer rejects the exemption.\n"
    AutoAdditionalChargesViolationFee:
      type: string
      minLength: 1
      maxLength: 1
      example: Y
      enum:
      - Y
      - N
    TransactionExemptionReason:
      type: string
      example: '01'
      enum:
      - '01'
      - '02'
      - '04'
      description: "**Conditional: required when sending `transaction.exemptionAction = 02`**\n\nValue  | Description       \n-------|-----------------------------\n01     | Low value transaction (below 30 EUR or equivalent)\n02     | Low risk transaction (TRA)1\n04     | Secure Corporate Cards 3\n"
    AmountTipBasis:
      type: number
      maxLength: 14
      example: 130
      description: "The amount Commerce Engine will use to calclulate the tip percentage amounts on the tip screen. This is an optional field that will be used instead of `amount.total` in a scenario where the percentage calculations must be made on an amount other than the total amount. \n\nFor example, you have a $130 check and you make an initial payment of $30 using a gift card leaving a $100 remaining balance. When you process the remaining balance and you want to calculate the tip percentages based on the original $130 check total you would send `amount.total = 100` and `amount.tipBaiss = 130`\n"
    TaxFree:
      type: object
      description: 'Returned when the merchant is configured for tax-free processing. Contains card and transaction details for use with Global Blue''s tax-free shopping APIs.

        '
      properties:
        maskedPAN:
          type: string
          example: 476173******0043
          description: 'The masked pan containing the first 6 and last 4 digits.

            '
        cardCountry:
          type: string
          example: '124'
          description: 'Card issuing country in ISO 3166-1 (3 numeric digits) format

            '
        cardBrand:
          type: string
          enum:
          - VISA
          - MASTER
          - DINERS
          - JCB
          - AMEX
          - CUP
          description: 'Card brand


            | Value  | Decription                          |

            |--------|-------------------------------------|

            | VISA   | Visa Credit/Debit

            | MASTER | Mastercard Credit/Debit and Maestro |

            | DINERS | Discover/Diners                     |

            | JCB    | JCB                                 |

            | AMEX   | American Express                    |

            | CUP    | Unionpay Credit/Debit               |

            '
        cardType:
          type: string
          enum:
          - CreditCard
          - DebitCard
          - Prepaid
          description: 'Card type

            '
        expiryMonth:
          type: string
          example: '12'
          description: 'Expiration month

            '
        expiryYear:
          type: string
          example: '31'
          description: 'Expiration year

            '
        cardholderName:
          type: string
          example: TaxFree Shopper
          description: 'Cardholder name

            '
        pspReferenceNumber:
          type: string
          example: 112215bf-93a3-4856-b1ca-23d175dd2fa9
          description: 'Shift4 transaction reference number shared with Global Blue.

            '
    DCCMarginOverECB:
      type: string
      maxLength: 5
      example: '2.85'
      description: 'Markup of offered exchange rate over ECB Reference Rate in percentage (%), if applicable. This field is applicable only for conversion between currencies of EU countries, e.g. EUR --> DKK or SEK --> CZK.


        This field will not be returned if the transaction is not in scope of EU Regulation 2019/518.

        '
    AirlineNumberOfCities:
      type: number
      maxLength: 2
      example: 5
      description: 'The number of airports or cities for each leg on the ticket (including origination and destination cities).

        '
    CardSecurityCodeResult:
      type: string
      minLength: 1
      maxLength: 1
      readOnly: true
      example: M
      enum:
      - M
      - N
      - P
      - S
      - U
      - Y
      - '1'
      - '2'
      - '3'
      description: '**Conditional: Returned if `card.securityCode.indicator` and `card.securityCode.value` are sent in the request.**


        The result of a CSC check. This field will be used by Shift4 to determine the value sent in the `card.securityCode.valid` field (based on the merchant’s list of accepted verification results as configured with Shift4).


        Value|Description

        -----|------------

        M    | CSC matched.

        N    | CSC did not match.

        P    | CSC not processed.

        S    | CSC should have been present.

        U    | Issuer unable to process.

        Y    | CVC1 incorrect.

        1    | CSC Unavailable - processor / card type does not support this parameter.

        2    | An unrecognised result code was returned by the processor.

        3    | No result code was returned by the processor.

        '
    DCCTransactionID:
      type: string
      maxLength: 50
      example: 1A2820D2G334
      description: 'A unique identifier returned in the ratelookup response to link with the initial authorization, Sale transaction types.

        '
