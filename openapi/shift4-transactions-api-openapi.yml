    get:
      tags:
      - Transactions
      summary: Invoice Information
      operationId: getinvoice
      security:
      - AccessToken: []
      description: 'Used to request the status (e.g., approved, declined, error, referral, etc.) for a specific invoice; it is primarily used after a timeout or error has occurred. Voided or batched and settled invoices will return an “Invoice Not Found” error. For more information, see the Timeouts and Communication Failures section.


        *Note: The GET request does not support a request body. Sending an empty request body may result in an error.*


        **Integration Methods:**

        - Host Direct

        - Locally Installed UTG

        - Commerce Engine For On Premise

        - Commerce Engine For Cloud


        See the Integration Methods and URLs Section sections of the Development Quick Start guide for details regarding each processing option.'
